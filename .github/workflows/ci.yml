name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      SOLANA_NETWORK: devnet
      SOLANA_RPC_URL: https://api.devnet.solana.com
      NEXT_PUBLIC_SOLANA_NETWORK: devnet
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      VIDEO_PROVIDER: local
      METADATA_PROVIDER: self
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          FRAGFUN_SKIP_PROD_CHECKS: "1"
      - run: npx playwright install --with-deps chromium
      - name: Integration + E2E (embedded Postgres, devnet, local video provider)
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health > /dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/api/health > /dev/null || (cat dev.log; exit 1)
          npm run test:integration
          npm run test:e2e
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
